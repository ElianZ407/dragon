<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Dragon</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000000; color: #ecfccb; overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .stage {
      position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
      background: #000000; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .dragon-frame {
      position: relative;
      width: min(100vw, calc(100dvh * 485 / 632));
      height: min(100dvh, calc(100vw * 632 / 485));
      background: #000000;
      z-index: 5;
      overflow: hidden;
    }
    .dragon-img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      filter: contrast(1.38) brightness(0.95) saturate(1.75);
      mix-blend-mode: lighten;
    }
    .edge-fade {
      position: absolute; inset: 0; z-index: 6; pointer-events: none;
      background:
        linear-gradient(to bottom, #000000 15%, rgba(0, 0, 0, 0) 24%, rgba(0, 0, 0, 0) 88%, #000000 100%),
        linear-gradient(to right, #000000 0%, rgba(0, 0, 0, 0) 9%, rgba(0, 0, 0, 0) 91%, #000000 100%);
    }
    .eye-glow-overlay {
      position: absolute; inset: 0; z-index: 7; pointer-events: none; mix-blend-mode: screen;
      background:
        radial-gradient(ellipse 14% 10.5% at 34% 62%, rgba(185, 255, 25, 0.98) 0%, rgba(95, 255, 0, 0.65) 45%, transparent 78%),
        radial-gradient(ellipse 14% 10.5% at 66% 62%, rgba(185, 255, 25, 0.98) 0%, rgba(95, 255, 0, 0.65) 45%, transparent 78%);
      animation: eyePulse 0.55s ease-in-out infinite;
    }
    .eyelid-layer { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
    .lid-top, .lid-bottom {
      position: absolute; left: 22%; width: 56%; background: #000000;
      transition: transform 0.075s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .lid-top {
      top: 52.5%; height: 11%; transform: scaleY(0); transform-origin: top center;
      border-bottom-left-radius: 50% 40%; border-bottom-right-radius: 50% 40%;
    }
    .lid-bottom {
      top: 62.5%; height: 10%; transform: scaleY(0); transform-origin: bottom center;
      border-top-left-radius: 50% 40%; border-top-right-radius: 50% 40%;
    }
    .is-blinking .lid-top, .is-blinking .lid-bottom { transform: scaleY(1.18); }
    .is-blinking .eye-glow-overlay { opacity: 0 !important; animation: none !important; }
    @keyframes eyePulse {
      0%, 100% { opacity: 0.22; }
      50% { opacity: 1; }
    }
    .qr-screen {
      position: fixed; inset: 0; z-index: 50;
      background: #000000;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; text-align: center;
    }
    .qr-title { font-size: clamp(26px, 5vw, 48px); font-weight: 900; color: #a3e635; margin: 0 0 10px; letter-spacing: 0.04em; text-shadow: 0 0 28px rgba(132, 255, 0, 0.8); }
    .qr-sub { font-size: 16px; color: rgba(217, 249, 157, 0.9); margin: 0 0 24px; max-width: 480px; }
    .qr-card { padding: 18px; border-radius: 20px; background: #ffffff; box-shadow: 0 0 60px rgba(132, 255, 0, 0.85); }
    .qr-img { width: min(65vw, 300px); height: min(65vw, 300px); display: block; border-radius: 8px; }
  </style>
</head>

  <script>
    const stage = document.getElementById('stage');
    const dragonFrame = document.getElementById('dragonFrame');
    let blinkTimer = null;

    const triggerBlink = (doubleBlink = false) => {
      dragonFrame.classList.add('is-blinking');
      setTimeout(() => {
        dragonFrame.classList.remove('is-blinking');
        if (doubleBlink) setTimeout(() => triggerBlink(false), 130);
      }, 115);
    };

    const scheduleBlink = () => {
      clearTimeout(blinkTimer);
      blinkTimer = setTimeout(() => {
        triggerBlink(Math.random() < 0.35);
        scheduleBlink();
      }, 550 + Math.random() * 650);
    };

    const activarPantallaCompleta = () => {
      if (!document.fullscreenElement) {
        const el = document.documentElement;
        (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
      }
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').catch(() => {});
      }
    };

    stage.addEventListener('click', () => {
      activarPantallaCompleta();
      triggerBlink(true);
    });

    if (String(new URLSearchParams(window.location.search).get('vista') || '').toLowerCase() === 'qr') {
      const urlLimpia = window.location.href.split('?')[0];
      document.getElementById('qrImgReal').src = 'https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=10&data=' + encodeURIComponent(urlLimpia);
      document.getElementById('qrScreen').style.display = 'flex';
    }

    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(() => {});
    scheduleBlink();
  </script>
</body>
</html>
